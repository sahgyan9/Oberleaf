<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="50%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#49A4BB" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#2E6FA0" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#2F39A9" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="ribbonMain" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2F39A9" />
      <stop offset="30%" stop-color="#2E6FA0" />
      <stop offset="70%" stop-color="#49A4BB" />
      <stop offset="100%" stop-color="#15D8B3" />
    </linearGradient>

    <linearGradient id="ribbonFront" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#15D8B3" />
      <stop offset="40%" stop-color="#49A4BB" />
      <stop offset="80%" stop-color="#2E6FA0" />
      <stop offset="100%" stop-color="#2F39A9" />
    </linearGradient>

    <linearGradient id="pageFoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15D8B3" />
      <stop offset="70%" stop-color="#49A4BB" />
      <stop offset="100%" stop-color="#2E6FA0" />
    </linearGradient>

    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#15D8B3" flood-opacity="0.38" />
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#2E6FA0" flood-opacity="0.5" />
    </filter>

    <filter id="innerFoldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-2" dy="-3" stdDeviation="4" flood-color="#0B0F19" flood-opacity="0.6" />
    </filter>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <radialGradient id="ambientMint" cx="70%" cy="30%" r="55%">
    <stop offset="0%" stop-color="#15D8B3" stop-opacity="0.22" />
    <stop offset="100%" stop-color="#15D8B3" stop-opacity="0" />
  </radialGradient>
  <circle cx="340" cy="180" r="170" fill="url(#ambientMint)" />

  <g filter="url(#neonGlow)">
    <path 
      d="M 256,256 
         C 292,204 336,172 384,172 
         C 436,172 468,208 468,256 
         C 468,304 436,340 384,340 
         C 336,340 292,308 256,256 Z" 
      fill="none" 
      stroke="url(#ribbonMain)" 
      stroke-width="52" 
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <path 
      d="M 128,172 
         C 176,172 220,204 256,256 
         C 288,302 332,340 384,340 
         C 424,340 452,314 460,280" 
      fill="none" 
      stroke="url(#ribbonFront)" 
      stroke-width="52" 
      stroke-linecap="round" 
    />

    <path 
      d="M 256,256 
         C 220,308 176,340 128,340 
         C 80,340 44,304 44,256 
         C 44,208 80,172 128,172" 
      fill="none" 
      stroke="url(#ribbonMain)" 
      stroke-width="52" 
      stroke-linecap="round" 
    />

    <path 
      d="M 330,188 
         C 360,174 384,172 400,174 
         C 442,180 464,212 466,252" 
      fill="none" 
      stroke="#15D8B3" 
      stroke-width="8" 
      stroke-linecap="round" 
      opacity="0.9" 
    />

    <g filter="url(#innerFoldShadow)">
      <polygon 
        points="96,296 148,342 96,342" 
        fill="#0B0F19" 
        opacity="0.45" 
      />
      <path 
        d="M 94,292 
           C 106,310 122,326 146,340 
           L 102,340 
           C 96,340 92,336 92,330 
           Z" 
        fill="url(#pageFoldGrad)" 
        stroke="#15D8B3" 
        stroke-width="3" 
      />
      <line 
        x1="94" y1="292" 
        x2="146" y2="340" 
        stroke="#FFFFFF" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        opacity="0.75" 
      />
    </g>

    <path 
      d="M 242,238 C 248,246 254,256 260,264" 
      stroke="#0B0F19" 
      stroke-width="14" 
      stroke-linecap="round" 
      opacity="0.35" 
    />
  </g>
</svg>
